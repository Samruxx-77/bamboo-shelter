<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=818, viewport-fit=cover">
<title>Video analytics – Studio</title>
<style>
:root{--bg:#0f0f0f;--card:#0f0f0f;--text:#f1f1f1;--mut:#aaa;--line:#303030;--btn:#272727;--tile:#282828;--blue:#3ea6ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--card:#fff;--text:#0f0f0f;--mut:#606060;--line:#e5e5e5;--btn:#f2f2f2;--tile:#f2f2f2;--blue:#065fd4;color-scheme:light}}
:root[data-theme="light"]{--bg:#fff;--card:#fff;--text:#0f0f0f;--mut:#606060;--line:#e5e5e5;--btn:#f2f2f2;--tile:#f2f2f2;--blue:#065fd4;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 13px/1.4 Roboto,Arial,sans-serif}
svg{fill:currentColor;flex:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}.ib:hover{background:var(--btn)}
.logo{display:flex;align-items:center;gap:4px;font-size:19px;font-weight:500;letter-spacing:-.5px;margin-right:auto;margin-left:4px}
.logo i{width:26px;height:18px;border-radius:5px;background:#f03;display:grid;place-items:center}.logo i b{width:0;height:0;border-left:7px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent}
.pill{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:17px;font-weight:500;font-size:13px}.pill:hover{background:var(--btn)}
.av{width:32px;height:32px;border-radius:50%;margin:0 4px 0 6px;background:radial-gradient(circle at 35% 30%,#c9a24a,#5b3a1a 60%,#1a1208)}
#pb{position:fixed;left:0;right:0;top:calc(56px + env(safe-area-inset-top,0px));height:2px;z-index:10;pointer-events:none}
#pb i{display:block;height:100%;width:0;background:#8a8a8a;transition:width .5s}
.wrap{display:flex}
.rail{width:56px;flex:none;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:2px}
.rail .ib{border-radius:4px;width:40px;height:40px}.rail .on{background:var(--btn)}
.rail .th{width:40px;height:26px;margin:4px 0 6px;border-radius:2px;background:linear-gradient(135deg,#6b7a3a,#3d4a22)}
.rail .bt{margin-top:auto;margin-bottom:8px}
main{flex:1;min-width:0;padding:0 24px 80px}
.top{display:flex;align-items:flex-start;justify-content:space-between;padding-top:24px}
h1{margin:6px 0 0;font-size:20px;font-weight:700;letter-spacing:-.3px}
.adv{height:34px;padding:0 16px;border-radius:17px;background:var(--btn);font-weight:500;font-size:13px;margin-top:2px}
.tabrow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin-top:14px;gap:12px}
.tabs{display:flex;gap:8px;overflow:auto}.tabs button{padding:14px 16px 12px;color:var(--mut);font-weight:500;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs .on{color:var(--text);border-color:var(--text)}
.dr{display:flex;align-items:center;gap:20px;padding-right:4px}.dr small{display:block;color:var(--mut);font-size:11px}.dr span{font-size:13px;font-weight:500}
#c{padding-top:16px;min-height:600px}
.h2{font-size:20px;font-weight:500;margin:6px 0 14px;letter-spacing:-.2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;align-items:start}.col{display:grid;gap:16px}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.card{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.pad{padding:20px 20px 16px}
.ct{font-size:15px;font-weight:500;letter-spacing:-.1px}.cs{color:var(--mut);font-size:12px;margin-top:2px}
.mut{color:var(--mut)}
.tiles{display:flex}.tile{flex:1;text-align:center;padding:16px 8px 14px;background:var(--tile);border-left:1px solid var(--line)}.tile:first-child{background:none;border:0}
.tile small{display:block;font-size:11px;color:var(--mut)}.tile b{display:block;font-size:20px;font-weight:700;margin-top:2px}
.more{display:inline-block;height:32px;line-height:32px;padding:0 16px;border-radius:16px;background:var(--btn);font-weight:500;font-size:12px;margin-top:14px}
.ch{display:flex;height:112px;margin-top:26px}.plot{flex:1;position:relative}.plot i{position:absolute;left:0;right:0;height:1px;background:var(--line)}.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.yl{width:52px;position:relative;font-size:10.5px;color:var(--mut)}.yl span{position:absolute;right:0;transform:translateY(-50%)}
.xl{display:flex;justify-content:space-between;margin:8px 52px 0 0;font-size:10.5px;color:var(--mut)}
.sh{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.08)}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12px}.row .l{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:3px}.dot{width:5px;height:5px;border-radius:50%;margin-right:2px}.bw{width:130px;display:flex;justify-content:flex-end}
.rt{font-size:12px;min-width:44px;text-align:right}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.thumb{width:92px;height:164px;border-radius:2px;background:linear-gradient(180deg,#9bb07a,#4d6b3a 45%,#c9c9c0 60%,#6d6a5c);flex:none}
.ply{display:flex;align-items:center;gap:12px;font-size:12px;width:100%;margin-top:6px}.pgs{height:3px;background:#555;border-radius:2px;margin-top:-6px;width:100%}
.leg{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:16px;gap:8px}.leg .d{display:inline-block;width:6px;height:6px;border-radius:50%;background:#666;margin:0 8px 1px}
.don{width:104px;height:104px;border-radius:50%;margin:10px auto 16px;display:grid;place-items:center;font-size:10px;color:var(--mut);text-align:center}
.don div{width:80px;height:80px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.step{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:2px}.step.sel{background:#3b3a5e}.step .ic{width:32px;height:32px;border-radius:50%;background:#2a2a3d;display:grid;place-items:center;flex:none;color:#9c8cf5}.step .t{flex:1}.step b{font-weight:400;font-size:13px;display:block}.step span{font-size:11px;color:var(--mut)}
a{color:var(--blue);text-decoration:none}
.sp{display:flex;align-items:flex-end;gap:2px;height:44px;margin-top:14px}.sp i{flex:1;background:#31b4e6;min-width:2px;opacity:.9}

/* ---- Studio fidelity overrides ---- */

.top{padding-top:28px}

#c{padding-top:24px}

.ov{grid-template-columns:minmax(0,1fr) 330px;gap:36px}
.g2{grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.col{gap:20px}
.row{font-size:13px;padding:9px 0}.rt{font-size:13px}

.tabs{margin-left:-9px;gap:3px}.tabs button{padding:12px 16px 11px;font-size:14px;font-weight:500;line-height:18px}

#c{padding-top:16px;min-height:700px}

.pad>.ch:first-child{margin-top:20px}
.g2{gap:20px;margin-top:22px}.col{gap:22px}
.row{font-size:12px;padding:8px 0}.rt{font-size:12px}

.rc .plot{border-left:1px solid #f03}.rc .ch{margin-top:30px}

.tabrow{position:relative;overflow:visible}
